# vim:fileencoding=utf-8:foldmethod=marker

# ── Font ─────────────────────────────────────────────
font_family      IosevkaTermNerdFontMono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# ── Cursor ───────────────────────────────────────────
cursor_shape                block
cursor_shape_unfocused      hollow
cursor_beam_thickness       1.5
cursor_blink_interval       0
cursor_stop_blinking_after  0

# ── Window chrome ────────────────────────────────────
hide_window_decorations yes
window_padding_width   4
window_margin_width    4

# ── Layouts ──────────────────────────────────────────
enabled_layouts splits:split_axis=horizontal,stack

# ── Tab bar (hidden by default, toggle with ctrl+shift+t) ──
tab_bar_edge bottom
tab_bar_margin_width 0
tab_bar_margin_height 0
tab_bar_style separator
tab_separator " "
tab_bar_min_tabs 2
tab_title_template " ({index}) {tab.active_oldest_exe} "
active_tab_title_template " ({index}) {tab.active_oldest_exe} "
active_tab_font_style bold


# ── Misc ─────────────────────────────────────────────
enable_audio_bell no
shell_integration no-cursor
mouse_hide_wait  3.0

# ── Keybindings ─────────────────────────────────────
map alt+shift+v launch --cwd=current --location=vsplit
map alt+shift+s launch --cwd=current --location=hsplit
map alt+shift+x close_window
map alt+shift+h neighboring_window left
map alt+shift+l neighboring_window right
map alt+shift+j neighboring_window down
map alt+shift+k neighboring_window up

map --new-mode resize --timeout 5.0 alt+shift+r
map --mode resize h     resize_window narrower 10
map --mode resize l     resize_window wider 10
map --mode resize k     resize_window taller 5
map --mode resize j     resize_window shorter 5
map --mode resize esc   pop_keyboard_mode
map --mode resize enter pop_keyboard_mode

map alt+shift+c new_tab_with_cwd
map alt+shift+, set_tab_title
map alt+shift+& close_tab
map alt+shift+n next_tab
map alt+shift+p previous_tab
map alt+shift+w select_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+shift+/ command_palette

