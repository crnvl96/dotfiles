# vim:fileencoding=utf-8:foldmethod=marker

font_family      IosevkaTermNerdFontMono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

cursor_shape                block
cursor_shape_unfocused      hollow
cursor_beam_thickness       1.5
cursor_blink_interval       0
cursor_stop_blinking_after  0

hide_window_decorations yes
window_padding_width   4
window_margin_width    4

enabled_layouts splits:split_axis=horizontal,stack

tab_bar_edge bottom
tab_bar_margin_width 0
tab_bar_margin_height 0
tab_bar_style separator
tab_separator " "
tab_bar_min_tabs 2
tab_title_template " ({index}) {tab.active_oldest_exe} "
active_tab_title_template " ({index}) {tab.active_oldest_exe} "
active_tab_font_style bold

enable_audio_bell no
shell_integration no-cursor
mouse_hide_wait  3.0

foreground #979eab
background #282c34

color0 #282c34
color1 #e06c75
color2 #98c379
color3 #e5c07b
color4 #61afef
color5 #be5046
color6 #56b6c2
color7 #979eab
color8 #393e48
color9 #d19a66
color10 #56b6c2
color11 #e5c07b
color12 #61afef
color13 #be5046
color14 #56b6c2
color15 #abb2bf

active_tab_foreground   #282c34
active_tab_background   #979eab
inactive_tab_foreground #abb2bf
inactive_tab_background #282c34

map alt+shift+v launch --cwd=current --location=vsplit
map alt+shift+s launch --cwd=current --location=hsplit
map alt+shift+x close_window
map alt+shift+h neighboring_window left
map alt+shift+l neighboring_window right
map alt+shift+j neighboring_window down
map alt+shift+k neighboring_window up

map alt+shift+c new_tab_with_cwd
map alt+shift+r set_tab_title
map alt+shift+q close_tab

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+shift+p command_palette
