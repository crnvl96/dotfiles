redactions = [
  "MONGODB_URI",
  "N8N_WEBHOOK_URL",
  "DG_SERVICE_API_KEY",
  "PERPLEXITY_API_KEY",
  "OPENROUTER_API_KEY",
]

[settings]
env_shell_expand = true

[tools]
aube = "1.17"
aws = { version = "latest", symlink_bins = "true" }
bat = "latest"
biome = "latest"
bun = "1.3"
difftastic = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
lazydocker = "latest"
lazygit = "latest"
lua-language-server = "latest"
mongosh = "latest"
neovim = "0.12.3"
node = "24"
oxfmt = "latest"
oxlint = "latest"
python = "3.14"
ripgrep = "latest"
ruff = "latest"
rust = "1.96.0"
stylua = "latest"
tmux = "latest"
tree-sitter = "latest"
ty = "latest"
typst = "latest"
uv = "latest"
zoxide = "latest"

[env]
_.file = { path = "$HOME/.config/mise/.env.local", redact = true }
_.path = [
  "$HOME/.local/bin",
  "$HOME/.bun/bin",
  "$HOME/.config/mise/scripts",
  "$HOME/.local/share/pnpm/bin",
  "$HOME/.opencode/bin",
]
PNPM_HOME="$HOME/.local/share/pnpm"
EDITOR = "nvim"
VISUAL = "nvim"
RIPGREP_CONFIG_PATH = "$HOME/.ripgreprc"
_ZO_RESOLVE_SYMLINKS = "1"

[shell_alias]
lzg = "lazygit"
ex = "exit"
cl = "clear"
nv = "nvim"
vim = "vimx"
vi = "vimx"
so = "source .venv/bin/activate"
nt = "scratchpad"
pi = "PI_FFF_MODE=override pi"
pin = "PI_FFF_MODE=override pi --no-session"
magnitude = "mise x node@24 -- magnitude"
ls = "eza -l"
la = "eza -la"
cat = "bat"
dtool = "git difftool -d"
dmain = "git difftool -d origin/main"
cc = "claude --dangerously-skip-permissions"
